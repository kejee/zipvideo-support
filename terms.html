<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZipVideo Terms of Service</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --primary: #6366F1;
      --primary-light: #818CF8;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text: #1E293B;
      --text-secondary: #64748B;
      --border: #E2E8F0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 40px 0 20px;
    }

    .header .app-icon {
      width: 80px;
      height: 80px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      filter: drop-shadow(0 8px 16px rgba(99, 102, 241, 0.2));
    }

    .header .app-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .header .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
    }

    /* Language Switcher */
    .markdown-body table {
      display: block;
      width: 100%;
      overflow-x: auto;
      border-collapse: collapse;
      font-size: 14px;
      margin: 12px 0;
      -webkit-overflow-scrolling: touch;
    }

    .markdown-body th {
      background: var(--primary);
      color: white;
      padding: 10px 12px;
      text-align: left;
      font-weight: 600;
    }

    .markdown-body td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .lang-switch {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 20px 0;
    }

    .lang-btn {
      padding: 8px 20px;
      border: 2px solid var(--border);
      border-radius: 100px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--card-bg);
      color: var(--text-secondary);
    }

    .lang-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .lang-btn.active {
      border-color: var(--primary);
      background: var(--primary);
      color: white;
    }

    /* Content */
    .content {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid var(--border);
    }

    /* Markdown Styles */
    .markdown-body h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border);
    }

    .markdown-body h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin: 24px 0 12px;
    }

    .markdown-body p {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .markdown-body strong {
      color: var(--text);
      font-weight: 600;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 30px 0;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .footer a {
      color: var(--primary);
      text-decoration: none;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container { padding: 10px 16px 40px; }
      .header { padding: 30px 0 10px; }
      .header h1 { font-size: 22px; }
      .markdown-body h1 { font-size: 24px; }
      .lang-btn { padding: 8px 16px; font-size: 13px; }
    }

    @media (max-width: 480px) {
      .header h1 { font-size: 20px; }
      .content { padding: 16px; }
      .markdown-body h1 { font-size: 20px; }
      .markdown-body h2 { font-size: 18px; }
      .app-icon { width: 64px; height: 64px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="app-icon">
        <img src="assets/logo.png" alt="ZipVideo Logo">
      </div>
      <h1 id="app-title">ZipVideo</h1>
      <p class="subtitle" id="subtitle">Terms of Service</p>
    </div>

    <div class="lang-switch">
      <button class="lang-btn active" data-lang="en">English</button>
      <button class="lang-btn" data-lang="zh">中文</button>
    </div>

    <div class="content">
      <div class="markdown-body" id="markdown-content">
        <div class="loading">Loading...</div>
      </div>
    </div>

    <div class="footer">
      <p id="footer-text">ZipVideo Development Team</p>
      <p style="margin-top:16px;">
        <a href="index.html">Home</a> &nbsp;|&nbsp;
        <a href="privacy.html">Privacy Policy</a>
      </p>
    </div>
  </div>

  <script>
    const langConfig = {
      en: {
        title: 'ZipVideo',
        subtitle: 'Terms of Service',
        footer: 'ZipVideo Development Team',
        mdFile: 'terms_of_service.md'
      },
      zh: {
        title: '压点视频 (ZipVideo)',
        subtitle: '服务条款',
        footer: '压点视频开发团队',
        mdFile: 'terms_of_service_zh.md'
      }
    };

    let currentLang = 'en';

    async function loadMarkdown(lang) {
      const config = langConfig[lang];
      const contentEl = document.getElementById('markdown-content');
      document.getElementById('app-title').textContent = config.title;
      document.getElementById('subtitle').textContent = config.subtitle;
      document.getElementById('footer-text').textContent = config.footer;
      document.documentElement.lang = lang;
      contentEl.innerHTML = '<div class="loading">Loading...</div>';

      try {
        const response = await fetch(config.mdFile);
        if (!response.ok) throw new Error('File not found');
        const markdown = await response.text();
        contentEl.innerHTML = marked.parse(markdown);
      } catch (error) {
        contentEl.innerHTML = `<p style="color:#EF4444;text-align:center;">Error loading content. Please try again.</p>`;
      }
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const lang = btn.dataset.lang;
        if (lang === currentLang) return;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentLang = lang;
        loadMarkdown(lang);
      });
    });

    loadMarkdown(currentLang);
  </script>
</body>
</html>
